name: Beta Deploy to TestFlight

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Install Fastlane
      run: |
        brew install fastlane
        
    - name: Setup App Store Connect API Key
      run: |
        cd "HOMEY Clean"
        echo '${{ secrets.ASC_API_KEY_JSON }}' > fastlane/asc_api_key.json
        
    - name: Build and Deploy to TestFlight
      run: |
        cd "HOMEY Clean"
        fastlane beta
        
    - name: Clean up API Key
      if: always()
      run: |
        cd "HOMEY Clean"
        rm -f fastlane/asc_api_key.json
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: build-artifacts
        path: |
          HOMEY Clean/fastlane/builds/
          HOMEY Clean/fastlane/logs/
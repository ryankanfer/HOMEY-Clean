<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="badgeGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#357ABD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E3A8A;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="rimGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Badge Background -->
  <circle cx="50" cy="50" r="45" fill="url(#badgeGradient)" stroke="url(#rimGradient)" stroke-width="3"/>
  
  <!-- Network Nodes -->
  <circle cx="35" cy="35" r="4" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="65" cy="35" r="4" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="50" cy="50" r="5" fill="#FFFFFF"/>
  <circle cx="30" cy="65" r="4" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="70" cy="65" r="4" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="50" cy="75" r="4" fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Network Connections -->
  <line x1="35" y1="35" x2="50" y2="50" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
  <line x1="65" y1="35" x2="50" y2="50" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
  <line x1="50" y1="50" x2="30" y2="65" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
  <line x1="50" y1="50" x2="70" y2="65" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
  <line x1="50" y1="50" x2="50" y2="75" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
  <line x1="30" y1="65" x2="50" y2="75" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <line x1="70" y1="65" x2="50" y2="75" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Central Hub Highlight -->
  <circle cx="50" cy="50" r="7" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
  
  <!-- Sparkle Effects -->
  <g opacity="0.8">
    <path d="M25 25 L27 27 L25 29 L23 27 Z" fill="#FFFFFF"/>
    <path d="M75 25 L77 27 L75 29 L73 27 Z" fill="#FFFFFF"/>
    <path d="M20 50 L22 52 L20 54 L18 52 Z" fill="#FFFFFF"/>

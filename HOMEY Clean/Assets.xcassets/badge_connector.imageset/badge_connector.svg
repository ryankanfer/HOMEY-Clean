<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="connectorGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#A855F7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9333EA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B21A8;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="connectorRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C084FC;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A855F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="starGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#F8FAFC;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#E2E8F0;stop-opacity:0.8" />
    </radialGradient>
  </defs>
  
  <!-- Badge Background -->
  <circle cx="50" cy="50" r="45" fill="url(#connectorGradient)" stroke="url(#connectorRim)" stroke-width="4"/>
  
  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.3"/>
  
  <!-- Main Star -->
  <path d="M50 20 L55.9 38.2 L76.1 38.2 L60.1 50 L66 68.2 L50 56.4 L34 68.2 L39.9 50 L23.9 38.2 L44.1 38.2 Z" 
        fill="url(#starGradient)" stroke="#A855F7" stroke-width="1"/>
  
  <!-- Inner Star Highlight -->
  <path d="M50 28 L53.5 40 L66.5 40 L56.5 47.5 L60 59.5 L50 52 L40 59.5 L43.5 47.5 L33.5 40 L46.5 40 Z" 
        fill="#A855F7" opacity="0.3"/>
  
  <!-- Central Gem -->
  <circle cx="50" cy="50" r="6" fill="#FFFFFF" stroke="#A855F7" stroke-width="1"/>
  <circle cx="50" cy="50" r="3" fill="#A855F7" opacity="0.8"/>
  
  <!-- Radiating Lines -->
  <g stroke="#FFFFFF" stroke-width="1.5" opacity="0.6">
    <line x1="50" y1="15" x2="50" y2="25"/>
    <line x1="50" y1="75" x2="50" y2="85"/>
    <line x1="15" y1="50" x2="25" y2="50"/>
    <line x1="75" y1="50" x2="85" y2="50"/>
    <line x1="25.8" y1="25.8" x2="32.3" y2="32.3"/>
    <line x1="67.7" y1="67.7" x2="74.2" y2="74.2"/>
    <line x1="74.2" y1="25.8" x2="67.7" y2="32.3"/>
    <line x1="32.3" y1="67.7" x2="25.8" y2="74.2"/>
  </g>
  
  <!-- Sparkle Effects -->
  <g fill="#FFFFFF" opacity="0.9">
    <path d="M30 30 L32 32 L30 34 L28 32 Z"/>
    <path d="M70 30 L72 32 L70 34 L68 32 Z"/>
    <path d="M30 70 L32 72 L30 74 L28 72 Z"/>
    <path d="M70 70 L72 72 L70 74 L68 72 Z"/>
    <circle cx="25" cy="45" r="1"/>
    <circle cx="75" cy="55" r="1"/>
    <circle cx="45" cy="25" r="1"/>
    <circle cx="55" cy="75" r="1"/>
  </g>
  
  <!-- Outer Glow Ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#EC4899" stroke-width="0.5" opacity="0.4"/>
</svg>